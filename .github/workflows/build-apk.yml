
name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug --stacktrace

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeKTV-Mobile-APK
          path: app/build/outputs/apk/mobile/debug/*.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeKTV-TV-APK
          path: app/build/outputs/apk/tv/debug/*.apk
