<!DOCTYPE html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head>
<body><div id="player"></div><script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, pending='';
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{width:'100%',height:'100%',videoId:'',
 playerVars:{playsinline:1,rel:0,origin:'https://www.youtube.com'},
 events:{onReady:()=>{if(pending)loadVideo(pending)}}});
}
function pauseVideo(){if(player&&player.pauseVideo)player.pauseVideo();}
function resumeVideo(){if(player&&player.playVideo)player.playVideo();}
function loadVideo(id){
 if(!/^[a-zA-Z0-9_-]{11}$/.test(id))return;
 pending=id;
 if(player&&player.loadVideoById)player.loadVideoById(id);
}
</script></body></html>
